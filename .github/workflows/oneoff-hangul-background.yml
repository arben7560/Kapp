name: One-off Hangul background harmonization

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-hangul-background.yml"

permissions:
  contents: write

jobs:
  harmonize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply exact Hangul hub background styling
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          HUB_GRADIENT = '''<LinearGradient
            colors={["rgba(2,3,6,0.10)", "rgba(2,3,6,0.22)", "rgba(2,3,6,0.72)"]}
            locations={[0, 0.44, 1]}
            style={StyleSheet.absoluteFillObject}
            pointerEvents="none"
          />'''

          SHARED = Path("components/hangul/HangulLessonScreen.tsx")
          text = SHARED.read_text(encoding="utf-8")

          old_locked = '''<BlurView
            intensity={28}
            tint="dark"
            style={StyleSheet.absoluteFillObject}
          />

          <LinearGradient
            colors={[
              "rgba(2,3,6,0.62)",
              "rgba(2,3,6,0.82)",
              "rgba(2,3,6,0.97)",
            ]}
            locations={[0, 0.48, 1]}
            style={StyleSheet.absoluteFillObject}
          />'''

          new_stack = '''<BlurView
            intensity={18}
            tint="dark"
            style={StyleSheet.absoluteFillObject}
          />

          <View style={styles.vignetteOverlay} />

          ''' + HUB_GRADIENT + '''

          <View style={styles.ambientGlowTop} pointerEvents="none" />

          <View style={styles.ambientGlowBottom} pointerEvents="none" />'''

          if old_locked not in text:
              raise SystemExit("Locked Hangul background block not found")
          text = text.replace(old_locked, new_stack, 1)

          old_main = '''<BlurView
          intensity={26}
          tint="dark"
          style={StyleSheet.absoluteFillObject}
        />

        <LinearGradient
          colors={["rgba(2,3,6,0.42)", "rgba(2,3,6,0.66)", "rgba(2,3,6,0.92)"]}
          locations={[0, 0.46, 1]}
          style={StyleSheet.absoluteFillObject}
          pointerEvents="none"
        />

        <View style={styles.ambientGlowTop} pointerEvents="none" />

        <View style={styles.ambientGlowBottom} pointerEvents="none" />'''

          new_main = '''<BlurView
          intensity={18}
          tint="dark"
          style={StyleSheet.absoluteFillObject}
        />

        <View style={styles.vignetteOverlay} />

        <LinearGradient
          colors={["rgba(2,3,6,0.10)", "rgba(2,3,6,0.22)", "rgba(2,3,6,0.72)"]}
          locations={[0, 0.44, 1]}
          style={StyleSheet.absoluteFillObject}
          pointerEvents="none"
        />

        <View style={styles.ambientGlowTop} pointerEvents="none" />

        <View style={styles.ambientGlowBottom} pointerEvents="none" />'''

          if old_main not in text:
              raise SystemExit("Main Hangul background block not found")
          text = text.replace(old_main, new_main, 1)

          old_glows = '''  ambientGlowTop: {
    position: "absolute",

    top: 120,

    right: -110,

    width: 250,

    height: 250,

    borderRadius: 125,

    backgroundColor: "rgba(103,232,249,0.025)",

    boxShadow: "0px 0px 70px rgba(103,232,249,0.05)",
  },

  ambientGlowBottom: {
    position: "absolute",

    top: 590,

    left: -140,

    width: 280,

    height: 280,

    borderRadius: 140,

    backgroundColor: "rgba(94,234,212,0.018)",

    boxShadow: "0px 0px 80px rgba(94,234,212,0.04)",
  },'''

          new_glows = '''  vignetteOverlay: {
    ...StyleSheet.absoluteFillObject,

    backgroundColor: "rgba(2,3,6,0.52)",
  },

  ambientGlowTop: {
    position: "absolute",

    top: 100,
    right: -110,

    width: 250,
    height: 250,

    borderRadius: 125,

    backgroundColor: "rgba(103,232,249,0.05)",

    boxShadow: "0px 0px 90px rgba(103,232,249,0.10)",
  },

  ambientGlowBottom: {
    position: "absolute",

    top: 510,
    left: -130,

    width: 260,
    height: 260,

    borderRadius: 130,

    backgroundColor: "rgba(94,234,212,0.035)",

    boxShadow: "0px 0px 100px rgba(94,234,212,0.07)",
  },'''

          if old_glows not in text:
              raise SystemExit("Hangul ambient glow styles not found")
          text = text.replace(old_glows, new_glows, 1)
          SHARED.write_text(text, encoding="utf-8")

          def harmonize_simple(path_str, old_gradient):
              path = Path(path_str)
              src = path.read_text(encoding="utf-8")
              stack = '''<BlurView intensity={18} tint="dark" style={StyleSheet.absoluteFillObject} />
        <View style={styles.vignetteOverlay} />
        <LinearGradient
          colors={["rgba(2,3,6,0.10)", "rgba(2,3,6,0.22)", "rgba(2,3,6,0.72)"]}
          locations={[0, 0.44, 1]}
          style={StyleSheet.absoluteFillObject}
          pointerEvents="none"
        />
        <View style={styles.ambientGlowTop} pointerEvents="none" />
        <View style={styles.ambientGlowBottom} pointerEvents="none" />'''
              if old_gradient not in src:
                  raise SystemExit(f"Background gradient not found in {path_str}")
              src = src.replace(old_gradient, stack, 1)
              marker = '  background: { flex: 1 },'
              styles = '''  background: { flex: 1, overflow: "hidden", backgroundColor: "#020306" },
  vignetteOverlay: {
    ...StyleSheet.absoluteFillObject,
    backgroundColor: "rgba(2,3,6,0.52)",
  },
  ambientGlowTop: {
    position: "absolute",
    top: 100,
    right: -110,
    width: 250,
    height: 250,
    borderRadius: 125,
    backgroundColor: "rgba(103,232,249,0.05)",
    boxShadow: "0px 0px 90px rgba(103,232,249,0.10)",
  },
  ambientGlowBottom: {
    position: "absolute",
    top: 510,
    left: -130,
    width: 260,
    height: 260,
    borderRadius: 130,
    backgroundColor: "rgba(94,234,212,0.035)",
    boxShadow: "0px 0px 100px rgba(94,234,212,0.07)",
  },'''
              if marker not in src:
                  raise SystemExit(f"Background style marker not found in {path_str}")
              src = src.replace(marker, styles, 1)
              path.write_text(src, encoding="utf-8")

          harmonize_simple(
              "app/(tabs)/hangul/assessment.tsx",
              '<LinearGradient colors={["rgba(2,3,6,0.68)", "rgba(2,3,6,0.93)"]} style={StyleSheet.absoluteFillObject} />',
          )

          harmonize_simple(
              "app/(tabs)/hangul/bridge.tsx",
              '<LinearGradient colors={["rgba(2,3,6,0.65)", "rgba(2,3,6,0.94)"]} style={StyleSheet.absoluteFillObject} />',
          )
          PY

      - name: Commit harmonized backgrounds and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/oneoff-hangul-background.yml
          git add components/hangul/HangulLessonScreen.tsx app/'(tabs)'/hangul/assessment.tsx app/'(tabs)'/hangul/bridge.tsx .github/workflows/oneoff-hangul-background.yml
          git diff --cached --check
          git commit -m "style: align all Hangul backgrounds with hub"
          git push origin HEAD:main
