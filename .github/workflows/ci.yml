name: CI

on:
  push:
  pull_request:

jobs:
  runtime-corrections:
    name: Runtime corrections (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: FR/JA catalogue integrity
        run: npm run validate:i18n

      - name: Localization foundations
        run: npm run test:i18n

      - name: Japanese vocabulary localization
        run: npm run test:vocabulary

      - name: Japanese counting localization
        run: npm run test:counting-localization

      - name: Japanese classifier localization
        run: npm run test:classifiers-localization

      - name: Japanese grammar localization — stages 1–5
        run: npm run test:grammar-localization

      - name: Counting audio contract
        run: npm run test:counting-audio

      - name: Hangul learning and localization
        run: npm run test:hangul

      - name: Auth sync
        run: npm run test:auth-sync

      - name: Auth production
        run: npm run test:auth-production

      - name: Full cloud snapshot
        run: npm run test:progress-cloud

      - name: Premium runtime
        run: npm run test:premium

      - name: Immersion runtime
        run: npm run test:immersion

      - name: Café Japanese feedback localization
        run: npm run test:cafe-localization

      - name: Café conversation summary pedagogy
        run: npm run test:cafe-summary

      - name: Métro Japanese feedback and summary
        run: npm run test:metro-localization

      - name: Restaurant Japanese feedback and lesson copy
        run: npm run test:restaurant-localization

      - name: Aéroport Japanese feedback and dialogue
        run: npm run test:aeroport-localization

      - name: Daily streak
        run: npm run test:streak

      - name: Reject whitespace errors
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

  immersion-japanese:
    name: Immersion Japanese corrections (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and catalogue integrity
        run: |
          npx tsc --noEmit
          npm run validate:i18n

      - name: Café Japanese and summary
        run: |
          npm run test:cafe-localization
          npm run test:cafe-summary

      - name: Métro Japanese
        if: always()
        run: npm run test:metro-localization

      - name: Restaurant Japanese
        if: always()
        run: npm run test:restaurant-localization

      - name: Aéroport Japanese
        if: always()
        run: npm run test:aeroport-localization

  known-debt:
    name: Known pre-existing debt (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # These checks were already red before the runtime corrections. Keep them
    # visible without masking failures from the blocking runtime-corrections job.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Global lint debt
        continue-on-error: true
        run: npm run lint

      - name: Media contract debt
        continue-on-error: true
        run: npm run test:media

      - name: Cafe speech debt
        continue-on-error: true
        run: npm run test:cafe-speech

      - name: Metro speech debt
        continue-on-error: true
        run: npm run test:metro-speech

      - name: Restaurant speech debt
        continue-on-error: true
        run: npm run test:restaurant-speech

      - name: Airport speech debt
        continue-on-error: true
        run: npm run test:aeroport-speech

      - name: Grammar debt
        continue-on-error: true
        run: npm run test:grammar

      - name: UI validation debt
        continue-on-error: true
        run: npm run validate:ui
