name: CI

on:
  push:
  pull_request:

jobs:
  runtime-corrections:
    name: Runtime corrections (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Auth sync
        run: npm run test:auth-sync

      - name: Auth production
        run: npm run test:auth-production

      - name: Full cloud snapshot
        run: npm run test:progress-cloud

      - name: Premium runtime
        run: npm run test:premium

      - name: Immersion runtime
        run: npm run test:immersion

      - name: Daily streak
        run: npm run test:streak

      - name: Reject whitespace errors
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

  known-debt:
    name: Known pre-existing debt (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # These checks were already red before the runtime corrections. Keep them
    # visible without masking failures from the blocking runtime-corrections job.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Global lint debt
        continue-on-error: true
        run: npm run lint

      - name: Media contract debt
        continue-on-error: true
        run: npm run test:media

      - name: Cafe speech debt
        continue-on-error: true
        run: npm run test:cafe-speech

      - name: Metro speech debt
        continue-on-error: true
        run: npm run test:metro-speech

      - name: Restaurant speech debt
        continue-on-error: true
        run: npm run test:restaurant-speech

      - name: Airport speech debt
        continue-on-error: true
        run: npm run test:aeroport-speech

      - name: Grammar debt
        continue-on-error: true
        run: npm run test:grammar

      - name: UI validation debt
        continue-on-error: true
        run: npm run validate:ui
