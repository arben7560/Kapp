name: One-off Vocabulary card background

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-vocabulary-card.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Add Vocabulary asset and wire hub card
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TEMP_REF: tmp-vocabulary-card-upload
        run: |
          python <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          temp_ref = os.environ["TEMP_REF"]
          api = f"https://api.github.com/repos/{repo}"

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def request_json(url, method="GET", data=None):
              body = None if data is None else json.dumps(data).encode("utf-8")
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          chunks = []
          for number in range(1, 9):
              chunk_path = f".tmp-vocab/chunk{number:02d}.txt"
              encoded_chunk = urllib.parse.quote(chunk_path, safe="/")
              payload = request_json(
                  f"{api}/contents/{encoded_chunk}?ref={urllib.parse.quote(temp_ref)}"
              )
              chunk = base64.b64decode(payload["content"].replace("\n", "")).decode("utf-8")
              chunks.append(chunk)

          image_bytes = base64.b64decode("".join(chunks))

          asset_path = "assets/images/vocabulary-card.jpg"
          asset_url = f"{api}/contents/{urllib.parse.quote(asset_path, safe='/')}"
          asset_sha = None
          try:
              asset_sha = request_json(f"{asset_url}?ref=main").get("sha")
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise

          asset_update = {
              "message": "add Vocabulary card background asset",
              "content": base64.b64encode(image_bytes).decode("ascii"),
              "branch": "main",
          }
          if asset_sha:
              asset_update["sha"] = asset_sha
          request_json(asset_url, method="PUT", data=asset_update)

          index_path = "app/(tabs)/index.tsx"
          index_url = f"{api}/contents/{urllib.parse.quote(index_path, safe='/')}"
          index_file = request_json(f"{index_url}?ref=main")
          source = base64.b64decode(index_file["content"].replace("\n", "")).decode("utf-8")

          target = '    narrative: "Apprends le vocabulaire selon le contexte.",'
          background = '    background: require("../../assets/images/vocabulary-card.jpg"),'
          if background not in source:
              if target not in source:
                  raise SystemExit("Vocabulary narrative not found")
              source = source.replace(target, target + "\n" + background, 1)
              request_json(
                  index_url,
                  method="PUT",
                  data={
                      "message": "wire Vocabulary card background on home hub",
                      "content": base64.b64encode(source.encode("utf-8")).decode("ascii"),
                      "sha": index_file["sha"],
                      "branch": "main",
                  },
              )

          workflow_path = ".github/workflows/oneoff-vocabulary-card.yml"
          workflow_url = f"{api}/contents/{urllib.parse.quote(workflow_path, safe='/')}"
          workflow_file = request_json(f"{workflow_url}?ref=main")
          request_json(
              workflow_url,
              method="DELETE",
              data={
                  "message": "chore: remove one-off Vocabulary updater",
                  "sha": workflow_file["sha"],
                  "branch": "main",
              },
          )
          PY
