name: One-off Count card background

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-count-card.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Count asset and wire hub card
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/081c66e993a0374dc94b817c25ed8b4c34175396" \
            | jq -r '.content' \
            | tr -d '\n' \
            | base64 -d > /tmp/count-card.png

          file /tmp/count-card.png
          mkdir -p assets/images
          cp /tmp/count-card.png assets/images/count-card.png

          python <<'PY'
          from pathlib import Path

          path = Path("app/(tabs)/index.tsx")
          source = path.read_text(encoding="utf-8")
          background = '    background: require("../../assets/images/count-card.png"),'

          if background not in source:
              needle = '    narrative: "Maîtrise les nombres dans le réel.",\n    type: "pedagogical",'
              replacement = '    narrative: "Maîtrise les nombres dans le réel.",\n' + background + '\n    type: "pedagogical",'
              if needle not in source:
                  raise SystemExit("Comptage sequence block not found")
              source = source.replace(needle, replacement, 1)
              path.write_text(source, encoding="utf-8")
          PY

          rm .github/workflows/oneoff-count-card.yml

          git config user.name "K-App automation"
          git config user.email "actions@users.noreply.github.com"
          git add 'app/(tabs)/index.tsx' assets/images/count-card.png .github/workflows/oneoff-count-card.yml
          git commit -m "add Count card background to home hub"
          git push origin HEAD:main
