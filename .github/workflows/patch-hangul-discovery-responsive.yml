name: Patch Hangul discovery responsive

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply responsive discovery grid patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/hangul/HangulLessonScreen.tsx')
          text = path.read_text()

          old = '''  const landscapeDiscoveryColumns = !isLandscape
    ? 1
    : responsive.contentWidth >= 900
      ? 3
      : responsive.contentWidth >= 640
        ? 2
        : 1;
  const landscapeCardWidth =
    isLandscape && landscapeDiscoveryColumns > 1
      ? responsive.getGridItemWidth(landscapeDiscoveryColumns, 14)
      : "100%";'''

          new = '''  const discoveryGridGap = 14;
  const discoveryMinCardWidth = 220;
  const landscapeDiscoveryColumns = !isLandscape
    ? 1
    : Math.max(
        1,
        Math.min(
          3,
          Math.floor(
            (responsive.contentWidth + discoveryGridGap) /
              (discoveryMinCardWidth + discoveryGridGap),
          ),
        ),
      );
  const landscapeCardWidth =
    isLandscape && landscapeDiscoveryColumns > 1
      ? responsive.getGridItemWidth(landscapeDiscoveryColumns, discoveryGridGap)
      : "100%";'''

          if old not in text:
              raise SystemExit('Target responsive block not found')

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/hangul/HangulLessonScreen.tsx
          git commit -m "Fix Hangul discovery landscape grid"
          git push origin main
