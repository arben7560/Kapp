name: Apply vocabulary card fixes once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-vocab-cards-once.yml'

permissions:
  contents: write

jobs:
  patch-vocabulary-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch vocabulary hub
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('app/(tabs)/voc/index.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'type VocabularyTheme = {\n  id: number;\n',
                  'type VocabularyTheme = {\n  id: number;\n  monogram?: string;\n',
              ),
              (
                  '  {\n    id: 5,\n    title: "Vie nocturne",\n',
                  '  {\n    id: 5,\n    monogram: "N",\n    title: "Vie nocturne",\n',
              ),
              (
                  '              {theme.title.charAt(0)}\n',
                  '              {theme.monogram ?? theme.title.charAt(0)}\n',
              ),
              (
                  '''        <View style={styles.collectionFooter}>\n          <View style={styles.collectionFooterLine}>\n            <View\n              style={[\n                styles.collectionFooterAccent,\n                premiumLocked && styles.collectionFooterAccentPremiumLocked,\n                premiumActive && styles.collectionFooterAccentPremiumActive,\n                isCurrent && styles.collectionFooterAccentCurrent,\n              ]}\n            />\n          </View>\n''',
                  '''        <View style={styles.collectionFooter}>\n          <View style={styles.collectionFooterLine} />\n''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/fix-vocab-cards-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(tabs)/voc/index.tsx' .github/workflows/fix-vocab-cards-once.yml
          git commit -m "fix(vocab): clarify monograms and card footer"
          git push origin main
