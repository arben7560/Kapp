name: Add Hangul card background

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-hangul-card.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add image and apply home card style
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          blob_sha = "5ea2f2608e2bcc7d8cd156d2edfecc8650ac6614"
          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/git/blobs/{blob_sha}",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)

          image_bytes = base64.b64decode(payload["content"].replace("\n", ""))
          image_path = Path("assets/images/hangul-card.png")
          image_path.parent.mkdir(parents=True, exist_ok=True)
          image_path.write_bytes(image_bytes)

          index_path = Path("app/(tabs)/index.tsx")
          source = index_path.read_text(encoding="utf-8")

          narrative_line = "    narrative: \"Décrypte l'âme visuelle de la ville.\","
          background_line = '    background: require("../../assets/images/hangul-card.png"),'
          if background_line not in source:
              if narrative_line not in source:
                  raise SystemExit("Hangul narrative not found")
              source = source.replace(narrative_line, narrative_line + "\n" + background_line, 1)

          if "source={item.background}" not in source:
              blur_marker = "intensity={isActive ? 62 : 48}"
              blur_pos = source.find(blur_marker)
              if blur_pos < 0:
                  raise SystemExit("SequenceCard blur marker not found")
              gradient_pos = source.find("<LinearGradient", blur_pos)
              if gradient_pos < 0:
                  raise SystemExit("SequenceCard gradient marker not found")

              lines = [
                  "{item.background ? (",
                  "  <>",
                  "    <ImageBackground",
                  "      source={item.background}",
                  "      resizeMode=\"cover\"",
                  "      style={StyleSheet.absoluteFill}",
                  "      pointerEvents=\"none\"",
                  "    />",
                  "    <BlurView",
                  "      intensity={7}",
                  "      tint=\"dark\"",
                  "      style={StyleSheet.absoluteFill}",
                  "      pointerEvents=\"none\"",
                  "    />",
                  "    <LinearGradient",
                  "      colors={[",
                  "        \"rgba(2,4,7,0.30)\",",
                  "        \"rgba(2,4,7,0.50)\",",
                  "        \"rgba(2,3,6,0.72)\",",
                  "      ]}",
                  "      locations={[0, 0.52, 1]}",
                  "      start={{ x: 0, y: 0 }}",
                  "      end={{ x: 1, y: 1 }}",
                  "      style={StyleSheet.absoluteFill}",
                  "      pointerEvents=\"none\"",
                  "    />",
                  "  </>",
                  ") : null}",
                  "",
              ]
              image_layers = "\n".join("        " + line for line in lines)
              source = source[:gradient_pos] + image_layers + source[gradient_pos:]

          index_path.write_text(source, encoding="utf-8")
          Path(".github/workflows/add-hangul-card.yml").unlink()
          PY

      - name: Commit update
        run: |
          git config user.name "K-App automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "add Hangul card background to home hub"
          git push origin HEAD:main
