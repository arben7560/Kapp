name: Add Hangul card background

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-hangul-card.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add image and apply home card style
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          blob_sha = "5ea2f2608e2bcc7d8cd156d2edfecc8650ac6614"
          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/git/blobs/{blob_sha}",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)

          image_bytes = base64.b64decode(payload["content"].replace("\n", ""))
          image_path = Path("assets/images/hangul-card.png")
          image_path.parent.mkdir(parents=True, exist_ok=True)
          image_path.write_bytes(image_bytes)

          index_path = Path("app/(tabs)/index.tsx")
          source = index_path.read_text(encoding="utf-8")

          hangul_old = '''    place: "CENTRE D'APPRENTISSAGE",
              narrative: "Décrypte l'âme visuelle de la ville.",
              type: "pedagogical",'''.replace("              ", "    ")
          hangul_new = '''    place: "CENTRE D'APPRENTISSAGE",
              narrative: "Décrypte l'âme visuelle de la ville.",
              background: require("../../assets/images/hangul-card.png"),
              type: "pedagogical",'''.replace("              ", "    ")

          if hangul_old not in source:
              raise SystemExit("Hangul sequence block not found")
          source = source.replace(hangul_old, hangul_new, 1)

          card_anchor = '''      <BlurView
                intensity={isActive ? 62 : 48}
                tint="dark"
                style={styles.sequenceCard}
              >
                <LinearGradient'''.replace("                ", "        ")

          card_replacement = '''      <BlurView
                intensity={isActive ? 62 : 48}
                tint="dark"
                style={styles.sequenceCard}
              >
                {item.background ? (
                  <>
                    <ImageBackground
                      source={item.background}
                      resizeMode="cover"
                      style={StyleSheet.absoluteFill}
                      pointerEvents="none"
                    />

                    <BlurView
                      intensity={7}
                      tint="dark"
                      style={StyleSheet.absoluteFill}
                      pointerEvents="none"
                    />

                    <LinearGradient
                      colors={[
                        "rgba(2,4,7,0.30)",
                        "rgba(2,4,7,0.50)",
                        "rgba(2,3,6,0.72)",
                      ]}
                      locations={[0, 0.52, 1]}
                      start={{ x: 0, y: 0 }}
                      end={{ x: 1, y: 1 }}
                      style={StyleSheet.absoluteFill}
                      pointerEvents="none"
                    />
                  </>
                ) : null}

                <LinearGradient'''.replace("                ", "        ")

          if card_anchor not in source:
              raise SystemExit("SequenceCard BlurView anchor not found")
          source = source.replace(card_anchor, card_replacement, 1)
          index_path.write_text(source, encoding="utf-8")

          workflow_path = Path(".github/workflows/add-hangul-card.yml")
          workflow_path.unlink()
          PY

      - name: Commit update
        run: |
          git config user.name "K-App automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "add Hangul card background to home hub"
          git push origin HEAD:main
