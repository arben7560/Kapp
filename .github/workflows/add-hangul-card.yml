name: Add Hangul card background

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-hangul-card.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add image and apply home card style
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python <<'PY'
          import base64
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          blob_sha = "5ea2f2608e2bcc7d8cd156d2edfecc8650ac6614"
          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/git/blobs/{blob_sha}",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)

          image_bytes = base64.b64decode(payload["content"].replace("\n", ""))
          image_path = Path("assets/images/hangul-card.png")
          image_path.parent.mkdir(parents=True, exist_ok=True)
          image_path.write_bytes(image_bytes)

          index_path = Path("app/(tabs)/index.tsx")
          source = index_path.read_text(encoding="utf-8")

          narrative_line = '    narrative: "Décrypte l\'âme visuelle de la ville.",'
          background_line = '    background: require("../../assets/images/hangul-card.png"),'
          if background_line not in source:
              if narrative_line not in source:
                  raise SystemExit("Hangul narrative not found")
              source = source.replace(
                  narrative_line,
                  narrative_line + "\n" + background_line,
                  1,
              )

          pattern = re.compile(
              r'(?P<open>\s*<BlurView\s*\n\s*intensity=\{isActive \? 62 : 48\}\s*\n\s*tint="dark"\s*\n\s*style=\{styles\.sequenceCard\}\s*\n\s*>)(?P<gap>\s*)(?P<gradient><LinearGradient)',
              re.MULTILINE,
          )

          image_layers = '''
        {item.background ? (
          <>
            <ImageBackground
              source={item.background}
              resizeMode="cover"
              style={StyleSheet.absoluteFill}
              pointerEvents="none"
            />
            <BlurView
              intensity={7}
              tint="dark"
              style={StyleSheet.absoluteFill}
              pointerEvents="none"
            />
            <LinearGradient
              colors={[
                "rgba(2,4,7,0.30)",
                "rgba(2,4,7,0.50)",
                "rgba(2,3,6,0.72)",
              ]}
              locations={[0, 0.52, 1]}
              start={{ x: 0, y: 0 }}
              end={{ x: 1, y: 1 }}
              style={StyleSheet.absoluteFill}
              pointerEvents="none"
            />
          </>
        ) : null}

        '''

          if "source={item.background}" not in source:
              source, count = pattern.subn(
                  lambda match: match.group("open") + "\n" + image_layers + match.group("gradient"),
                  source,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"SequenceCard anchor matches: {count}")

          index_path.write_text(source, encoding="utf-8")
          Path(".github/workflows/add-hangul-card.yml").unlink()
          PY

      - name: Commit update
        run: |
          git config user.name "K-App automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "add Hangul card background to home hub"
          git push origin HEAD:main
