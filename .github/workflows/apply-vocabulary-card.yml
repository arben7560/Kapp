name: Apply Vocabulary card background

on:
  push:
    branches: [tmp-vocabulary-card-upload]
    paths:
      - ".github/workflows/apply-vocabulary-card.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build asset and update main
        run: |
          set -euo pipefail

          cat .tmp-vocab/chunk*.txt > /tmp/vocabulary-card.b64
          base64 -d /tmp/vocabulary-card.b64 > /tmp/vocabulary-card.jpg

          git config user.name "K-App automation"
          git config user.email "actions@users.noreply.github.com"

          git fetch origin main
          git checkout -B main origin/main

          mkdir -p assets/images
          cp /tmp/vocabulary-card.jpg assets/images/vocabulary-card.jpg

          python <<'PY'
          from pathlib import Path

          path = Path("app/(tabs)/index.tsx")
          source = path.read_text(encoding="utf-8")

          old = '''  {
            title: "Vocabulaire",
            label: "Vocabulaire",
            hubAccent: HubModuleAccents.vocabulary,
            route: "/voc",
            trackKey: "vocab",
            place: "SÉOUL • VOCABULAIRE",
            narrative: "Apprends le vocabulaire selon le contexte.",
            type: "pedagogical",
          },'''.replace("            ", "    ")

          new = '''  {
            title: "Vocabulaire",
            label: "Vocabulaire",
            hubAccent: HubModuleAccents.vocabulary,
            route: "/voc",
            trackKey: "vocab",
            place: "SÉOUL • VOCABULAIRE",
            narrative: "Apprends le vocabulaire selon le contexte.",
            background: require("../../assets/images/vocabulary-card.jpg"),
            type: "pedagogical",
          },'''.replace("            ", "    ")

          background_line = '    background: require("../../assets/images/vocabulary-card.jpg"),'

          if background_line not in source:
              if old not in source:
                  raise SystemExit("Vocabulary sequence block not found")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")
          PY

          git add 'app/(tabs)/index.tsx' assets/images/vocabulary-card.jpg
          git commit -m "add Vocabulary card background to home hub"
          git push origin HEAD:main
