name: K-App premium scene labels

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kapp-premium-scene-labels.yml

permissions:
  contents: write

jobs:
  update-scene-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Update shared scene modal labels
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="repos/${GITHUB_REPOSITORY}/contents/app/(tabs)/speak.tsx"
          response="$(gh api "${endpoint}?ref=main")"
          sha="$(printf '%s' "$response" | jq -r '.sha')"
          printf '%s' "$response" | jq -r '.content' | tr -d '\n' | base64 --decode > /tmp/speak.tsx

          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/speak.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('icon="IA"', 'icon="실전"'),
              ('icon="Aa"', 'icon="표현"'),
              ('<AppText variant="label" tone="strong" align="center">', '<AppText variant="label" script="korean" tone="strong" align="center">'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count == 1:
                  text = text.replace(old, new, 1)
              elif count == 0 and new in text:
                  continue
              else:
                  raise SystemExit(f'Unexpected occurrence count for {old!r}: {count}')

          path.write_text(text, encoding='utf-8')
          PY

          content="$(base64 -w 0 /tmp/speak.tsx)"
          gh api --method PUT "$endpoint" \
            -f message='Polish scene modal option labels' \
            -f content="$content" \
            -f sha="$sha" \
            -f branch='main'
