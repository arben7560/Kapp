name: Apply Vocabulary card background via API

on:
  push:
    branches: [tmp-vocabulary-card-upload]
    paths:
      - ".github/workflows/apply-vocabulary-card-api.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Update asset and hub through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TEMP_REF: tmp-vocabulary-card-upload
        run: |
          python <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          temp_ref = os.environ["TEMP_REF"]
          api = f"https://api.github.com/repos/{repo}"

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def request_json(url, method="GET", data=None):
              body = None if data is None else json.dumps(data).encode("utf-8")
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          chunks = []
          for number in range(1, 9):
              path = f".tmp-vocab/chunk{number:02d}.txt"
              encoded_path = urllib.parse.quote(path, safe="/")
              payload = request_json(f"{api}/contents/{encoded_path}?ref={urllib.parse.quote(temp_ref)}")
              chunks.append(base64.b64decode(payload["content"].replace("\n", "")).decode("utf-8"))

          image_b64 = "".join(chunks)
          image_bytes = base64.b64decode(image_b64)

          asset_path = "assets/images/vocabulary-card.jpg"
          encoded_asset = urllib.parse.quote(asset_path, safe="/")
          asset_url = f"{api}/contents/{encoded_asset}"

          asset_sha = None
          try:
              current_asset = request_json(f"{asset_url}?ref=main")
              asset_sha = current_asset.get("sha")
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise

          asset_payload = {
              "message": "add Vocabulary card background asset",
              "content": base64.b64encode(image_bytes).decode("ascii"),
              "branch": "main",
          }
          if asset_sha:
              asset_payload["sha"] = asset_sha
          request_json(asset_url, method="PUT", data=asset_payload)

          index_path = "app/(tabs)/index.tsx"
          encoded_index = urllib.parse.quote(index_path, safe="/")
          index_url = f"{api}/contents/{encoded_index}"
          current_index = request_json(f"{index_url}?ref=main")
          source = base64.b64decode(current_index["content"].replace("\n", "")).decode("utf-8")

          target = '    narrative: "Apprends le vocabulaire selon le contexte.",'
          background = '    background: require("../../assets/images/vocabulary-card.jpg"),'
          if background not in source:
              if target not in source:
                  raise SystemExit("Vocabulary narrative line not found")
              source = source.replace(target, target + "\n" + background, 1)

          index_payload = {
              "message": "wire Vocabulary card background on home hub",
              "content": base64.b64encode(source.encode("utf-8")).decode("ascii"),
              "sha": current_index["sha"],
              "branch": "main",
          }
          request_json(index_url, method="PUT", data=index_payload)
          PY
