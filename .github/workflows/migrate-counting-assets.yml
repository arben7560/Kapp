name: Migrate counting backgrounds

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-counting-assets.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow requests

      - name: Download, convert and wire local PNG backgrounds
        run: |
          python <<'PY'
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          import requests

          assets = Path("assets/images")
          assets.mkdir(parents=True, exist_ok=True)

          backgrounds = [
              (
                  "counting-base-card.png",
                  "https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=1600&q=88",
                  "https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=1000&q=82",
              ),
              (
                  "counting-sino-card.png",
                  "https://images.unsplash.com/photo-1534452203293-497d1f39106d?auto=format&fit=crop&w=1600&q=88",
                  "https://images.unsplash.com/photo-1534452203293-497d1f39106d?auto=format&fit=crop&w=1000&q=82",
              ),
              (
                  "counting-hours-card.png",
                  "https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=1600&q=88",
                  "https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=1000&q=82",
              ),
              (
                  "counting-prices-card.png",
                  "https://images.unsplash.com/photo-1562280963-8a5475740a10?auto=format&fit=crop&w=1600&q=88",
                  "https://images.unsplash.com/photo-1562280963-8a5475740a10?auto=format&fit=crop&w=1000&q=82",
              ),
              (
                  "counting-phone-card.png",
                  "https://images.unsplash.com/photo-1556740734-7f9a2b7a0f4d?auto=format&fit=crop&w=1600&q=88",
                  "https://images.unsplash.com/photo-1556740734-7f9a2b7a0f4d?auto=format&fit=crop&w=1000&q=82",
              ),
              (
                  "counting-dates-card.png",
                  "https://images.unsplash.com/photo-1464349095431-e9a21285b5f3?auto=format&fit=crop&w=1600&q=88",
                  "https://images.unsplash.com/photo-1464349095431-e9a21285b5f3?auto=format&fit=crop&w=1000&q=82",
              ),
              (
                  "counting-age-card.png",
                  "https://images.unsplash.com/photo-1528605248644-14dd04022da1?auto=format&fit=crop&w=1600&q=88",
                  "https://images.unsplash.com/photo-1528605248644-14dd04022da1?auto=format&fit=crop&w=1000&q=82",
              ),
              (
                  "counting-ordinals-card.png",
                  "https://images.unsplash.com/photo-1551818255-e6e10975bc17?auto=format&fit=crop&w=1600&q=88",
                  "https://images.unsplash.com/photo-1551818255-e6e10975bc17?auto=format&fit=crop&w=1000&q=82",
              ),
          ]

          headers = {"User-Agent": "K-App counting asset migration/1.0"}

          for filename, download_url, _ in backgrounds:
              response = requests.get(download_url, headers=headers, timeout=45)
              response.raise_for_status()
              image = Image.open(BytesIO(response.content)).convert("RGB")
              image.save(assets / filename, format="PNG", optimize=True, compress_level=9)
              print(f"created {filename}: {image.size[0]}x{image.size[1]}")

          index_path = Path("app/(tabs)/comptage/index.tsx")
          source = index_path.read_text(encoding="utf-8")

          for filename, _, old_url in backgrounds:
              old_block = f'''background: {{\n      uri: "{old_url}",\n    }},'''
              new_block = f'''background: require("../../../assets/images/{filename}"),'''
              if old_block not in source:
                  raise RuntimeError(f"Expected remote background block not found for {filename}")
              source = source.replace(old_block, new_block, 1)

          if "images.unsplash.com" in source:
              raise RuntimeError("A remote Unsplash counting card background remains in comptage/index.tsx")

          index_path.write_text(source, encoding="utf-8")
          PY

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/counting-*-card.png "app/(tabs)/comptage/index.tsx"
          git diff --cached --check
          git commit -m "Localize counting card backgrounds"
          git push origin main
