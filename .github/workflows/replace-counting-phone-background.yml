name: Replace counting phone background

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/replace-counting-phone-background.yml"

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow and requests
        run: python -m pip install --disable-pip-version-check pillow requests

      - name: Replace Telephone et contacts card background
        run: |
          python <<'PY'
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          import requests

          url = "https://images.unsplash.com/photo-1634196650884-ac296483ca4f?auto=format&fit=crop&fm=jpg&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&ixlib=rb-4.1.0&q=60&w=3000"
          response = requests.get(url, headers={"User-Agent": "K-App/1.0"}, timeout=60)
          response.raise_for_status()
          image = Image.open(BytesIO(response.content)).convert("RGB")

          # Crop to a landscape card ratio while keeping the phone and night bokeh central.
          target_ratio = 16 / 9
          w, h = image.size
          current_ratio = w / h
          if current_ratio < target_ratio:
              new_h = int(w / target_ratio)
              top = max(0, int((h - new_h) * 0.48))
              image = image.crop((0, top, w, top + new_h))
          else:
              new_w = int(h * target_ratio)
              left = max(0, (w - new_w) // 2)
              image = image.crop((left, 0, left + new_w, h))

          image = image.resize((1600, 900), Image.Resampling.LANCZOS)
          out = Path("assets/images/counting-phone-card.png")
          image.save(out, format="PNG", optimize=True, compress_level=9)
          print(f"saved {out} as {image.size[0]}x{image.size[1]}")
          PY

      - name: Commit replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/counting-phone-card.png
          git diff --cached --check
          git commit -m "Replace counting phone card background"
          git push origin main
