name: Normalize vocabulary headers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-voc-header.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize vocabulary headers
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('app/(tabs)/voc')
          changed = []

          for path in root.glob('*.tsx'):
              text = path.read_text(encoding='utf-8')
              original = text

              if '<View style={styles.topNav}>' not in text or '<AppBackButton' not in text:
                  continue

              # Give the header breathing room below the safe-area edge.
              topnav_match = re.search(r'  topNav: \{(?P<body>.*?)\n  \},', text, re.S)
              if topnav_match and 'paddingTop:' not in topnav_match.group('body'):
                  body = topnav_match.group('body')
                  body = '\n    paddingTop: 12,' + body
                  text = text[:topnav_match.start('body')] + body + text[topnav_match.end('body'):]

              # Make the title occupy the remaining header width and center it there.
              text = re.sub(
                  r'(<View style=\{styles\.topNav\}>\s*<AppBackButton(?:\s+[^>]*)?\s*/>\s*)<View>',
                  r'\1<View style={styles.navTitleWrap}>',
                  text,
                  count=1,
              )

              if 'navTitleWrap:' not in text:
                  text = re.sub(
                      r'(\n  navTitle: \{)',
                      '\n  navTitleWrap: {\n    flex: 1,\n    alignItems: "center",\n    justifyContent: "center",\n  },\n\\1',
                      text,
                      count=1,
                  )

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for p in changed:
              print('-', p)

      - name: Commit normalized headers
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(tabs)/voc/'
          git commit -m "Center vocabulary headers and add top spacing"
          git push
