name: Repair card JPEG assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-card-jpegs.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-encode card JPEGs
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image

          targets = [
              Path('assets/images/grammar-card.jpg'),
              Path('assets/images/vocabulary-card.jpg'),
          ]

          for path in targets:
              with Image.open(path) as image:
                  image.load()
                  print(f'before: {path} format={image.format} size={image.size} mode={image.mode}')
                  clean = image.convert('RGB')

              temp = path.with_suffix('.reencoded.jpg')
              clean.save(
                  temp,
                  format='JPEG',
                  quality=90,
                  optimize=True,
                  progressive=False,
                  subsampling=0,
              )

              with Image.open(temp) as check:
                  check.verify()

              temp.replace(path)

              with Image.open(path) as check:
                  print(f'after:  {path} format={check.format} size={check.size} mode={check.mode}')
                  check.verify()
          PY

          file assets/images/grammar-card.jpg
          file assets/images/vocabulary-card.jpg

      - name: Commit repaired assets
        run: |
          git config user.name "K-App automation"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/fix-card-jpegs.yml
          git add -A
          git commit -m "fix card JPEG assets for Metro bundler"
          git push origin HEAD:main
